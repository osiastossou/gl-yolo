# DOTA 1.5 dataset, découpé en tuiles 1024px (gap 200) via ultralytics/data/split_dota.py,
# pour entraîner sans faire exploser la RAM système : les images DOTA natives font jusqu'à
# 4000x4000px avec parfois plusieurs milliers d'instances chacune, ce qui fait planter
# TaskAlignedAssigner (OOM VRAM -> fallback CPU -> OOM RAM système -> SIGKILL) dès la
# première validation, peu importe l'architecture.
#
# Génère ce dataset une fois avant d'entraîner (voir le script de split donné séparément) :
#   from ultralytics.data.split_dota import split_trainval
#   split_trainval(data_root=".../datasets/DOTAv1.5", save_dir=".../datasets/DOTAv1.5-split",
#                   crop_size=1024, gap=200)
#
# Pas de split "test" ici : DOTA "test" n'a pas de labels publics (cf. evaluate_best.py),
# donc inutile pour ce projet.

path: DOTAv1.5-split # dataset root dir (résolu via le datasets_dir Ultralytics, comme DOTAv1.5.yaml)
train: images/train
val: images/val

# Classes for DOTA 1.5 (identique à DOTAv1.5.yaml)
names:
  0: plane
  1: ship
  2: storage tank
  3: baseball diamond
  4: tennis court
  5: basketball court
  6: ground track field
  7: harbor
  8: bridge
  9: large vehicle
  10: small vehicle
  11: helicopter
  12: roundabout
  13: soccer ball field
  14: swimming pool
  15: container crane
