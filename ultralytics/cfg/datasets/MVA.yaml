# MVA2023 Small Object Detection for Birds dataset (mva2023_sod4bird) — single class: bird
# Example usage: python train.py -data ultralytics/cfg/datasets/MVA.yaml ...
# parent
# ├── ultralytics
# └── datasets
#     └── MVA ← downloads here

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: MVA # dataset root dir
train: train/images # train images (relative to 'path')
val: valid/images # val images (relative to 'path')
test: valid/images # test images (optional)

# Classes
names:
  0: bird

# Download script/URL (optional) ---------------------------------------------------------------------------------------
# Fetches the zipped dataset from Hugging Face Hub -- plain HTTPS, no download quota (unlike the Google Drive
# share link this used before), works from any machine with internet access, no Drive mount required.
download: |
  from pathlib import Path

  from ultralytics.utils.downloads import safe_download

  dir = Path(yaml["path"]).resolve()  # datasets/MVA
  safe_download(
      url="https://huggingface.co/datasets/osiastossou/mva2023-sod4bird/resolve/main/mva2023_sod4bird_dataset.zip",
      dir=dir.parent,
      unzip=True,
      delete=True,
  )
  # le zip contient un dossier racine différent de "MVA" ("mva2023_sod4bird_dataset"), on le renomme.
  # on cible ce nom précis plutôt que "l'unique autre dossier de datasets/" -- ce dernier se casse dès
  # qu'un autre dataset (VisDrone, DOTAv1.5, ...) est déjà présent à côté.
  if not dir.exists():
      extracted = dir.parent / "mva2023_sod4bird_dataset"
      if extracted.exists():
          extracted.rename(dir)
      else:
          candidates = [p for p in dir.parent.iterdir() if p.is_dir() and p.name not in {"MVA", "__MACOSX"}]
          if len(candidates) == 1:
              candidates[0].rename(dir)
