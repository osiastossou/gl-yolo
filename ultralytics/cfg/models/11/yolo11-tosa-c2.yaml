# TinyYOLO — YOLOv11 modified for tiny-object detection
# ======================================================
# Three modifications vs. vanilla yolo11.yaml:
#
#   1. TOSA modules inserted after high-resolution feature maps
#      (layers 2 and 4 — stride-4 and stride-8 maps respectively)
#   2. AvgPoolDWConv replaces the two Conv(stride=2) downsamplers
#      that transition P2→P3 and P3→P4 in the backbone
#   3. P2 detection head added at stride 4 (160×160 for 640-px input)
#
# Modification vs. previous version:
#   - SPPF + C2PSA (layers 11 and 12) replaced by a single GL_CAB (layer 11)
#     GL_CAB handles both multi-scale pooling and attention in one block.
#     All head `from` references shifted by -1 accordingly.
#
# Usage:
#   from tinyyolo.tosa_attention import register_tosa
#   from tinyyolo.gl_cab import register_glcab
#   register_tosa()
#   register_glcab()
#   from ultralytics import YOLO
#   model = YOLO("tinyyolo_glcab.yaml")
#   model = YOLO("tinyyolo_glcab.yaml").load("yolo11n.pt")

nc: 80 # number of classes — override in your dataset YAML

scales:
  # [depth, width, max_channels]  — same as vanilla YOLO11
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ---------------------------------------------------------------------------
# Backbone
# ---------------------------------------------------------------------------
# Layer numbering:
#
#  0  Conv              P1/2   320×320
#  1  Conv              P2/4   160×160
#  2  C3k2              P2/4   160×160
#  3  TOSA              P2/4   160×160   ← mod 1
#  4  AvgPoolDWConv            80×80     ← mod 2
#  5  C3k2              P3/8    80×80
#  6  TOSA              P3/8    80×80    ← mod 1
#  7  AvgPoolDWConv            40×40     ← mod 2
#  8  C3k2              P4/16   40×40
#  9  Conv              P5/32   20×20
# 10  C3k2              P5/32   20×20
# 11  GL_CAB            P5/32   20×20    ← replaces SPPF(11) + C2PSA(12)
#
# ⚠️  Layer count: 12 layers (0–11) instead of 13 (0–12)
#     All head references shifted by -1 compared to previous version.

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] #  0  P1/2  320×320
  - [-1, 1, Conv, [128, 3, 2]] #  1  P2/4  160×160
  - [-1, 2, C3k2, [256, False, 0.25]] #  2        160×160
  - [-1, 1, TOSA, [256]] #  3  mod1  160×160
  - [-1, 1, AvgPoolDWConv, [256]] #  4  mod2   → 80×80
  - [-1, 2, C3k2, [512, False, 0.25]] #  5  P3/8   80×80
  - [-1, 1, TOSA, [512]] #  6  mod1   80×80
  - [-1, 1, AvgPoolDWConv, [512]] #  7  mod2   → 40×40
  - [-1, 2, C3k2, [512, True]] #  8  P4/16  40×40
  - [-1, 1, Conv, [1024, 3, 2]] #  9  P5/32  20×20
  - [-1, 2, C3k2, [1024, True]] # 10         20×20
  #- [-1, 1, GL_CAB,        [1024]]               # 11  ← SPPF + C2PSA → GL_CAB
  - [-1, 2, C2PSA, [1024]]

# ---------------------------------------------------------------------------
# Head (FPN + PAN + detection heads)
# ---------------------------------------------------------------------------
# Layer numbering continues from 12:
#
# 12  Upsample            → 40×40
# 13  Concat(12, 8)       → 40×40
# 14  C3k2  P4            → 40×40
#
# 15  Upsample            → 80×80
# 16  Concat(15, 6)       → 80×80   ← TOSA-processed P3
# 17  C3k2  P3            → 80×80
#
# 18  Upsample            → 160×160
# 19  Concat(18, 3)       → 160×160 ← TOSA-processed P2
# 20  C3k2  P2            → 160×160
#
# 21  Conv(stride2)       → 80×80
# 22  Concat(21, 17)      → 80×80
# 23  C3k2  P3            → 80×80
#
# 24  Conv(stride2)       → 40×40
# 25  Concat(24, 14)      → 40×40
# 26  C3k2  P4            → 40×40
#
# 27  Conv(stride2)       → 20×20
# 28  Concat(27, 11)      → 20×20   ← GL_CAB output (was layer 12)
# 29  C3k2  P5            → 20×20
#
# 30  Detect([P2=20, P3=23, P4=26, P5=29])

head:
  # --- Top-down FPN path ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12  40×40
  - [[-1, 8], 1, Concat, [1]] # 13  cat P4 backbone
  - [-1, 2, C3k2, [512, False]] # 14  P4/16  40×40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15  80×80
  - [[-1, 6], 1, Concat, [1]] # 16  cat P3 (post-TOSA, layer 6)
  - [-1, 2, C3k2, [256, False]] # 17  P3/8   80×80

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18  160×160
  - [[-1, 3], 1, Concat, [1]] # 19  cat P2 (post-TOSA, layer 3)
  - [-1, 2, C3k2, [128, False]] # 20  P2/4  160×160

  # --- Bottom-up PAN path ---
  - [-1, 1, Conv, [128, 3, 2]] # 21  → 80×80
  - [[-1, 17], 1, Concat, [1]] # 22  cat P3 FPN output
  - [-1, 2, C3k2, [256, False]] # 23  P3/8   80×80

  - [-1, 1, Conv, [256, 3, 2]] # 24  → 40×40
  - [[-1, 14], 1, Concat, [1]] # 25  cat P4 FPN output
  - [-1, 2, C3k2, [512, False]] # 26  P4/16  40×40

  - [-1, 1, Conv, [512, 3, 2]] # 27  → 20×20
  - [[-1, 11], 1, Concat, [1]] # 28  cat P5 — GL_CAB output (layer 11)
  - [-1, 2, C3k2, [1024, True]] # 29  P5/32  20×20

  # Detection: [P2, P3, P4, P5]
  - [[20, 23, 26, 29], 1, Detect, [nc]] # 30  Detect(P2/4, P3/8, P4/16, P5/32)
