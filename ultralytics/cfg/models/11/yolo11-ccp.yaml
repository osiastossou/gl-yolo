# CCP-YOLO Configuration
# Basée sur YOLOv11n avec modules personnalisés

nc: 6  # Nombre de classes (adapter selon votre dataset)
scales: # Facteurs de scaling du modèle : [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano
  s: [0.50, 0.50, 1024]  # small
  m: [0.50, 1.00, 512]   # medium
  l: [1.00, 1.00, 512]   # large
  x: [1.00, 1.50, 512]   # xlarge

# YOLOv11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 3, C3k2_MSD, [256, False]]                  # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 6, C3k2_MSD, [512, False]]                  # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 6, C3k2_MSD, [1024, False]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 3, C3k2_MSD, [1024, True]]                  # 8
  - [-1, 1, PSWCA, [1024, 5]]                     # 9
  - [-1, 1, C2PSA, [1024]]                       # 10

# YOLOv11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 11
  - [[-1, 6], 1, IAFM, [1]]                    # 12
  - [-1, 3, C3k2_MSD, [512, False]]                  # 13
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 14
  - [[-1, 4], 1, IAFM, [1]]                    # 15
  - [-1, 3, C3k2_MSD, [256, False]]                  # 16
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, IAFM, [1]]                   # 18
  - [-1, 3, C3k2_MSD, [512, False]]                  # 19
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 9], 1, IAFM, [1]]                    # 21
  - [-1, 3, C3k2_MSD, [1024, True]]                  # 22
  
  - [[16, 19, 22], 1, Detect, [nc]]              # 23 Detect(P3, P4, P5)