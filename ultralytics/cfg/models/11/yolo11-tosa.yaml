# TinyYOLO — YOLOv11 modified for tiny-object detection
# ======================================================
# Three modifications vs. vanilla yolo11.yaml:
#
#   1. TOSA modules inserted after high-resolution feature maps
#      (layers 2 and 4 — stride-4 and stride-8 maps respectively)
#   2. AvgPoolDWConv replaces the two Conv(stride=2) downsamplers
#      that transition P2→P3 and P3→P4 in the backbone
#   3. P2 detection head added at stride 4 (160×160 for 640-px input)
#
# Usage:
#   from tinyyolo.tosa_attention import register_tosa
#   register_tosa()
#   from ultralytics import YOLO
#   model = YOLO("tinyyolo.yaml")            # picks scale 'n' by default
#   model = YOLO("tinyyolo.yaml").load("yolo11n.pt")  # warm-start from vanilla weights
#
# The YAML is otherwise structurally identical to yolo11.yaml so that
# pre-trained backbone weights transfer cleanly.

nc: 80 # number of classes — override in your dataset YAML

scales:
  # [depth, width, max_channels]  — same as vanilla YOLO11
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ---------------------------------------------------------------------------
# Backbone
# ---------------------------------------------------------------------------
# Layer numbering (used by head's `from` references):
#
#  0  Conv        P1/2   320×320
#  1  Conv        P2/4   160×160   ← high-res map, tiny-object features live here
#  2  C3k2        P2/4   160×160
#  3  TOSA        P2/4   160×160   ← mod 1: amplify small-object channels+spatial
#  4  AvgPoolDWConv      80×80    ← mod 2: soft downsample P2→P3
#  5  C3k2        P3/8    80×80
#  6  TOSA        P3/8    80×80   ← mod 1: second TOSA on P3
#  7  AvgPoolDWConv      40×40    ← mod 2: soft downsample P3→P4
#  8  C3k2        P4/16   40×40
#  9  Conv        P5/32   20×20
# 10  C3k2        P5/32   20×20
# 11  SPPF               20×20
# 12  C2PSA              20×20
#
# Note: AvgPoolDWConv is channel-transparent (out == in), so width scaling
# propagates correctly through the backbone without special handling.

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] #  0  P1/2  320×320
  - [-1, 1, Conv, [128, 3, 2]] #  1  P2/4  160×160
  - [-1, 2, C3k2, [256, False, 0.25]] #  2        160×160
  - [-1, 1, TOSA, [256]] #  3  mod1  160×160  actual c=64 for scale n, 128 for s, 256 for m/l/x
  - [-1, 1, AvgPoolDWConv, [256]] #  4  mod2  → 80×80
  - [-1, 2, C3k2, [512, False, 0.25]] #  5  P3/8  80×80
  - [-1, 1, TOSA, [512]] #  6  mod1  80×80
  - [-1, 1, AvgPoolDWConv, [512]] #  7  mod2  → 40×40
  - [-1, 2, C3k2, [512, True]] #  8  P4/16 40×40
  - [-1, 1, Conv, [1024, 3, 2]] #  9  P5/32 20×20
  - [-1, 2, C3k2, [1024, True]] # 10        20×20
  - [-1, 1, SPPF, [1024, 5]] # 11        20×20
  - [-1, 2, C2PSA, [1024]] # 12        20×20

# ---------------------------------------------------------------------------
# Head (FPN + PAN + detection heads)
# ---------------------------------------------------------------------------
# Layer numbering continues from 13:
#
# 13  Upsample    → 40×40
# 14  Concat(13,8)→ 40×40
# 15  C3k2  P4    → 40×40
#
# 16  Upsample    → 80×80
# 17  Concat(16,6 after TOSA)  → 80×80   ← uses layer 6 (TOSA-processed P3)
# 18  C3k2  P3    → 80×80
#
# 19  Upsample    → 160×160
# 20  Concat(19,3 after TOSA)  → 160×160 ← uses layer 3 (TOSA-processed P2) — mod 3
# 21  C3k2  P2    → 160×160
#
# 22  Conv(stride2) → 80×80
# 23  Concat(22,18) → 80×80
# 24  C3k2  P3    → 80×80
#
# 25  Conv(stride2) → 40×40
# 26  Concat(25,15) → 40×40
# 27  C3k2  P4    → 40×40
#
# 28  Conv(stride2) → 20×20
# 29  Concat(28,12) → 20×20
# 30  C3k2  P5    → 20×20
#
# 31  Detect([P2=21, P3=24, P4=27, P5=30])   ← mod 3: four-head detection

head:
  # --- Top-down FPN path ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13  40×40
  - [[-1, 8], 1, Concat, [1]] # 14  cat P4 backbone
  - [-1, 2, C3k2, [512, False]] # 15  P4/16  40×40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16  80×80
  - [[-1, 6], 1, Concat, [1]] # 17  cat P3 (post-TOSA, layer 6)
  - [-1, 2, C3k2, [256, False]] # 18  P3/8   80×80

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19  160×160   — mod 3 begins
  - [[-1, 3], 1, Concat, [1]] # 20  cat P2 (post-TOSA, layer 3)
  - [-1, 2, C3k2, [128, False]] # 21  P2/4  160×160  ← new feature level

  # --- Bottom-up PAN path ---
  - [-1, 1, Conv, [128, 3, 2]] # 22  → 80×80
  - [[-1, 18], 1, Concat, [1]] # 23  cat P3 FPN output
  - [-1, 2, C3k2, [256, False]] # 24  P3/8   80×80

  - [-1, 1, Conv, [256, 3, 2]] # 25  → 40×40
  - [[-1, 15], 1, Concat, [1]] # 26  cat P4 FPN output
  - [-1, 2, C3k2, [512, False]] # 27  P4/16  40×40

  - [-1, 1, Conv, [512, 3, 2]] # 28  → 20×20
  - [[-1, 12], 1, Concat, [1]] # 29  cat P5 backbone
  - [-1, 2, C3k2, [1024, True]] # 30  P5/32  20×20

  # Detection: [P2, P3, P4, P5] — mod 3: P2 head at stride 4
  - [[21, 24, 27, 30], 1, Detect, [nc]] # 31  Detect(P2/4, P3/8, P4/16, P5/32)
