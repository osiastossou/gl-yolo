# YOLOv12 + GL-CAB
# ============================================================
# GL-CAB (Global-Local Combined Attention Block) remplace SPPF
# dans YOLOv11. Dans YOLOv12, SPPF n'existe plus ; son équivalent
# fonctionnel est la position après le dernier bloc A2C2f du
# backbone (layer 8, P5/32, 1024 ch). GL-CAB est donc inséré
# à cet endroit.
#
# Enregistrement requis dans votre code Python :
#   from ultralytics.nn.tasks import attempt_load_one_weight
#   # Ajouter GL_CAB dans ultralytics/nn/modules/__init__.py
#   # et dans ultralytics/nn/tasks.py (parse_model)
#
# Usage :
#   from ultralytics import YOLO
#   model = YOLO("yolo12_glcab.yaml")
#   model = YOLO("yolo12_glcab.yaml").load("yolo12n.pt")
# ============================================================

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00,  512]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

# ---------------------------------------------------------------------------
# Backbone
# ---------------------------------------------------------------------------
# Layer index (utilisé par les références `from` du head) :
#
#  0  Conv        P1/2   320×320
#  1  Conv        P2/4   160×160
#  2  C3k2        P2/4   160×160
#  3  Conv        P3/8    80×80
#  4  C3k2        P3/8    80×80
#  5  Conv        P4/16   40×40
#  6  A2C2f ×4   P4/16   40×40   ← head `from` ref
#  7  Conv        P5/32   20×20
#  8  A2C2f ×4   P5/32   20×20
#  9  GL_CAB      P5/32   20×20   ← remplace SPPF (channel-transparent)
#
# Toutes les références `from` du head sont décalées de +1
# par rapport au YAML YOLOv12 original (layers 6, 4 → 6, 4 inchangés
# car GL-CAB est ajouté après 8, pas entre 6 et 8).

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64,   3, 2]]          #  0  P1/2   320×320
  - [-1, 1, Conv,   [128,  3, 2]]          #  1  P2/4   160×160
  - [-1, 2, C3k2,   [256,  False, 0.25]]   #  2         160×160
  - [-1, 1, Conv,   [256,  3, 2]]          #  3  P3/8    80×80
  - [-1, 2, C3k2,   [512,  False, 0.25]]   #  4          80×80
  - [-1, 1, Conv,   [512,  3, 2]]          #  5  P4/16   40×40
  - [-1, 4, A2C2f,  [512,  True, 4]]       #  6          40×40
  - [-1, 1, Conv,   [1024, 3, 2]]          #  7  P5/32   20×20
  - [-1, 4, A2C2f,  [1024, True, 1]]       #  8          20×20
  - [-1, 1, GL_CAB, [1024]]               #  9  GL-CAB  20×20  ← ajout

# ---------------------------------------------------------------------------
# Head (FPN + PAN + detection)
# ---------------------------------------------------------------------------
# Les références `from` aux couches backbone sont :
#   layer 6 → P4 features (40×40)
#   layer 4 → P3 features (80×80)
#   layer 9 → P5 + GL-CAB output (20×20)  [était 8 dans YOLOv12 original]

head:
  - [-1,  1, nn.Upsample, [None, 2, "nearest"]]   # 10   40×40
  - [[-1, 6], 1, Concat, [1]]                     # 11   cat backbone P4
  - [-1,  2, A2C2f, [512, False, -1]]              # 12   P4/16  40×40

  - [-1,  1, nn.Upsample, [None, 2, "nearest"]]   # 13   80×80
  - [[-1, 4], 1, Concat, [1]]                     # 14   cat backbone P3
  - [-1,  2, A2C2f, [256, False, -1]]              # 15   P3/8   80×80

  - [-1,  1, Conv,  [256, 3, 2]]                  # 16   40×40
  - [[-1, 12], 1, Concat, [1]]                    # 17   cat head P4
  - [-1,  2, A2C2f, [512, False, -1]]              # 18   P4/16  40×40

  - [-1,  1, Conv,  [512, 3, 2]]                  # 19   20×20
  - [[-1, 9], 1, Concat, [1]]                     # 20   cat P5+GL-CAB  ← ref 9
  - [-1,  2, C3k2,  [1024, True]]                 # 21   P5/32  20×20

  - [[15, 18, 21], 1, Detect, [nc]]               # 22   Detect(P3, P4, P5)